<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Choose Theme</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Inter',sans-serif;
  margin:0;
  padding:20px;
  background:#232f52;
  color:white;
  overflow-y:auto;
  scrollbar-width:none;
}


 html, body{
  min-height:100%;
  overflow-y:auto;
  scrollbar-width:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
  display:none;
}
  
h2{
  text-align:left;
  margin-bottom:20px;
  margin-left:-8px;
  font-size:20px;
  font-weight:500;
  color:#ffffff;
  opacity:1;
}

  /* HEADER ROW */

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.header-row h2{
  margin-bottom:0;
}

/* ANIMATE CONTROL */

.animate-control{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:500;
  color:#ffffff;
  white-space:nowrap;
}

/* TOGGLE */

.switch{
  position:relative;
  display:inline-block;
  width:48px;
  height:26px;
  flex-shrink:0;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  cursor:pointer;
  inset:0;
  background:rgba(255,255,255,0.25);
  border-radius:26px;
  transition:.25s;
}

.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.25s;
}

.switch input:checked + .slider{
  background:rgba(255,255,255,0.55);
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

  @media (min-width:600px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

  .grid img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  cursor:pointer;
  border-radius:12px;
  transition:transform .2s ease, opacity .2s ease;
  border:2px solid transparent; /* 👈 important */
}

/* TOUCH FEEDBACK */

.grid img:active{
  transform:scale(.96);
  opacity:.8;
}

</style>
</head>

<body>

<div class="header-row">

  <h2>Choose your theme</h2>

  <div class="animate-control">
    <span>Animate background</span>

    <label class="switch">
      <input type="checkbox" id="animateToggle">
      <span class="slider"></span>
    </label>
  </div>

</div>

<div id="grid" class="grid"></div>

<script>

const SUPABASE_URL = "https://tppyzexttkuvcobbbmaz.supabase.co";
const SUPABASE_KEY = "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";

async function loadThemes(){

  const res = await fetch(
  `${SUPABASE_URL}/rest/v1/selfpracticetheme?select=*&active=eq.true&order=order_by.asc`,
    {
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await res.json();
 
  const grid = document.getElementById("grid");
  
 data.forEach(theme => {

  const img = document.createElement("img");
  img.src = theme.imageurl;

  const saved = localStorage.getItem("timer_theme_image");

  // ✅ Default theme (always visible border)
  if(theme.name.includes("default")){
    img.style.border = "2px solid rgba(255,255,255,0.5)";
  }

  // ✅ Selected theme (stronger border)
  if(saved === theme.imageurl){
  img.style.border = "3px solid white";
}

   // Store BOTH image + name (important for later)
img.onclick = () => {

  if(theme.name.toLowerCase().includes("default")){
    localStorage.removeItem("timer_theme");
    localStorage.removeItem("timer_theme_image");
  } else {
    localStorage.setItem("timer_theme", theme.name);
    localStorage.setItem("timer_theme_image", theme.imageurl);
  }

  window.location.href = "https://etl-1234.github.io/Timer/setup.html";
};

  grid.appendChild(img);
}); 

}

loadThemes();

</script>

</body>
</html>
