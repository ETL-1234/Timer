<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Choose Theme</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Inter',sans-serif;
  margin:0;
  padding:20px;
  background:#232f52;
  color:white;
  overflow-y:scroll;
  scrollbar-width:none;
}

body::-webkit-scrollbar{
  display:none;
}

h2{
  text-align:center;
  margin-bottom:20px;
  font-size:18px;
  font-weight:500;
  opacity:.9;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
}

.grid img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  cursor:pointer;
  border-radius:12px;
  transition:transform .2s ease, opacity .2s ease;
}

/* TOUCH FEEDBACK */

.grid img:active{
  transform:scale(.96);
  opacity:.8;
}

</style>
</head>

<body>

<h2>Choose your theme</h2>

<div id="grid" class="grid"></div>

<script>

const SUPABASE_URL = "https://tppyzexttkuvcobbbmaz.supabase.co";
const SUPABASE_KEY = "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";

async function loadThemes(){

  const res = await fetch(
  `${SUPABASE_URL}/rest/v1/selfpracticetheme?select=*&active=eq.true&order=order_by.asc`,
    {
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await res.json();
 
  const grid = document.getElementById("grid");
  
 data.forEach(theme => {

  const img = document.createElement("img");
  img.src = theme.imageurl;

  const saved = localStorage.getItem("timer_theme_image");

  // ✅ Default theme (always visible border)
  if(theme.name.includes("default")){
    img.style.border = "2px solid rgba(255,255,255,0.5)";
  }

  // ✅ Selected theme (stronger border)
  if(saved === theme.imageurl){
    img.style.outline = "3px solid white";
    img.style.outlineOffset = "-2px";
  }

   // Store BOTH image + name (important for later)
  img.onclick = () => {

    if(theme.name.toLowerCase().includes("default")){
      localStorage.removeItem("timer_theme");
      localStorage.removeItem("timer_theme_image");
    } else {
      localStorage.setItem("timer_theme", theme.name);
      localStorage.setItem("timer_theme_image", theme.imageurl);
    }

    window.location.href = "https://etl-1234.github.io/Timer/setup.html";
  };

  grid.appendChild(img);
}); 

}

loadThemes();

</script>

</body>
</html>
