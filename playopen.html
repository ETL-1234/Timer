// ANALYTICS SETTINGS
function getTimerAnalyticsSettings(){

  const themeName =
    localStorage.getItem("timeropen_theme");

  const animate =
    localStorage.getItem("timeropen_animate") === "true";

  const intervalDuration =
    parseInt(
      localStorage.getItem("timeropen_intervalduration"),
      10
    );

  const intervalBellUrl =
    localStorage.getItem("timeropen_intervalbell_url");

  let intervalBell = "none";

  if(intervalBellUrl){
    intervalBell = intervalBellUrl
      .split("/")
      .pop()
      .replace(/\.[^/.]+$/, "");
  }

  return {

    theme: themeName || "default",

    background: animate
      ? "animated"
      : "still",

    interval_bell: intervalBell,

    interval_minutes:
      intervalDuration || null

  };
}
  
  //COLOR OPACITY

  function hexToRGBA(hex, opacity){
  hex = hex.replace('#','');

  const r = parseInt(hex.substring(0,2), 16);
  const g = parseInt(hex.substring(2,4), 16);
  const b = parseInt(hex.substring(4,6), 16);

  return `rgba(${r}, ${g}, ${b}, ${opacity})`;
}
  
// APPLY THEME
async function applyTheme(name){

  const bgImage = document.getElementById("bgImage");
  const bgVideo = document.getElementById("bgVideo");

  if(!name){
    document.body.style.background = "#232f52";
    bgImage.style.display = "none";
    bgVideo.style.display = "none";
    return;
  }

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/selfpracticetheme?name=eq.${name}`,
    {
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await res.json();
  const theme = data[0];

  if(!theme) return;

  // TEXT COLOR
  if(theme.text_color){
    document.documentElement.style.setProperty(
      "--text-color",
      theme.text_color
    );
  }

  // BUTTON COLOR
  if(theme.button_color){
    const rgbaColor = hexToRGBA(theme.button_color, 0.2);

    document.getElementById("toggleBtn").style.background = rgbaColor;
    document.getElementById("editBtn").style.background = rgbaColor;
  }

  // BACKGROUND
  const animate = localStorage.getItem("timeropen_animate") === "true";

  if(animate && theme.mp4url){

    // ANIMATED BACKGROUND
    bgImage.style.display = "none";

    bgVideo.src = theme.mp4url;
    bgVideo.style.display = "block";

    bgVideo.muted = true;
    bgVideo.loop = true;
    bgVideo.playsInline = true;

    bgVideo.play().catch(()=>{});

  } else if(theme.imageurl){

    // STATIC JPG BACKGROUND
    bgVideo.pause();
    bgVideo.removeAttribute("src");
    bgVideo.load();
    bgVideo.style.display = "none";

    bgImage.src = theme.imageurl;
    bgImage.style.display = "block";
  }

  // GRADIENT
  if(theme.bg_start_gradient && theme.bg_end_gradient){
    document.body.style.background =
      `linear-gradient(${theme.bg_start_gradient}, ${theme.bg_end_gradient})`;
  }

  // OVERLAY
  if(theme.bg_overlay_color){
    document.getElementById("overlay").style.background =
      theme.bg_overlay_color;
  }
}

  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
