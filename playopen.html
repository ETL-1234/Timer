<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meditation Timer Open</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --text-color:#ffffff;
  --bg-color:#232f52;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

#bgImage{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
}

#overlay{
  position:fixed;
  inset:0;
  z-index:-2;
}

#timer{
  font-size:clamp(40px,10vw,80px);
  font-weight:600;
  transition:opacity 1.8s ease;
}

#controls{
  margin-top:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  transition:opacity 1.8s ease;
}

.fade-out{opacity:0;}

button{
  padding:14px 30px;
  width:160px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* JOURNAL BUTTON */

#journalBtn{
  margin-top:10px;
  background:none;
  border:none;
  cursor:pointer;
  opacity:0;
  transition:opacity 0.6s ease;
}

#journalBtn img{
  width:75px;
  opacity:0.4;
}
</style>
</head>

<body>

<img id="bgImage" src="">
<div id="overlay"></div>

<div>
  <div id="timer">00:00</div>
  <div id="controls">
    <button id="toggleBtn">Start</button>
    <button id="editBtn">End Practice</button>

    <button id="journalBtn">
     <img id="journalIcon" src="https://tppyzexttkuvcobbbmaz.supabase.co/storage/v1/object/public/Timer/icon/Icon_pen_white.png" />
    </button>

  </div>
</div>

<script>
const SUPABASE_URL = "https://tppyzexttkuvcobbbmaz.supabase.co";
const SUPABASE_KEY = "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";

// STATE
let seconds = 0;
let interval = null;
let paused = false;
let hasStarted = false;

let intervalAudio = null;

let lastInteraction = Date.now();

// ELEMENTS
const timerEl = document.getElementById("timer");
const toggleBtn = document.getElementById("toggleBtn");
const controls = document.getElementById("controls");
const journalBtn = document.getElementById("journalBtn");

// LOAD SETTINGS
function loadSettings(){
  const intervalBell = localStorage.getItem("timeropen_intervalbell_url");
  const intervalDuration = localStorage.getItem("timeropen_intervalduration");
  const themeName = localStorage.getItem("timeropen_theme");

  if(intervalBell) intervalAudio = new Audio(intervalBell);

  window.intervalDurationValue = intervalDuration;

  applyTheme(themeName);
}

  //COLOR OPACITY

  function hexToRGBA(hex, opacity){
  hex = hex.replace('#','');

  const r = parseInt(hex.substring(0,2), 16);
  const g = parseInt(hex.substring(2,4), 16);
  const b = parseInt(hex.substring(4,6), 16);

  return `rgba(${r}, ${g}, ${b}, ${opacity})`;
}
  
// APPLY THEME  
async function applyTheme(name){
  if(!name){
    document.body.style.background = "#232f52";
    return;
  }

  const encodedName = encodeURIComponent(name);

  const res = await fetch(`${SUPABASE_URL}/rest/v1/selfpracticetheme?name=eq.${name}`,{
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`
    }
  });

  const data = await res.json();
  const theme = data[0];
  if(!theme) return;

  if(theme.text_color) document.documentElement.style.setProperty("--text-color", theme.text_color);
  if(theme.button_color){
  const rgbaColor = hexToRGBA(theme.button_color, 0.2); // keep your 0.2 opacity
  document.getElementById("toggleBtn").style.background = rgbaColor;
  document.getElementById("editBtn").style.background = rgbaColor;
}

  if(theme.iconurl){
  document.getElementById("journalIcon").src = theme.iconurl;
}
  
  if(theme.imageurl) document.getElementById("bgImage").src = theme.imageurl;
  if(theme.bg_overlay_color) document.getElementById("overlay").style.background = theme.bg_overlay_color;
}

// FORMAT TIME
function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

// START TIMER
function startTimer(){
  hasStarted = true;

  interval = setInterval(()=>{
    if(!paused){
      seconds++;
      timerEl.innerText = formatTime(seconds);

      const intervalMin = parseInt(window.intervalDurationValue);

      if(intervalMin && intervalMin > 0 && intervalAudio){
        if(seconds % (intervalMin * 60) === 0){
          intervalAudio.currentTime = 0;
          intervalAudio.play().catch(()=>{});
        }
      }
    }
  },1000);
}

// BUTTONS
toggleBtn.onclick = () => {
  lastInteraction = Date.now();

  if(!interval){
    toggleBtn.innerText = "Pause";
    startTimer();
  } else {
    paused = !paused;
    toggleBtn.innerText = paused ? "Resume" : "Pause";

    // ✨ JOURNAL VISIBILITY
    if(paused){
      journalBtn.style.opacity = "1";
    } else {
      journalBtn.style.opacity = "0";
    }
  }
};

document.getElementById("editBtn").onclick = () => {
  window.location.href = "https://etl-1234.github.io/Timer/setupopen.html";
};

// JOURNAL NAVIGATION
journalBtn.onclick = () => {
  window.location.href = "https://etl-1234.github.io/Journal/journalpage.html";
};

// AUTO FADE UI
document.body.addEventListener("click", ()=>{
  lastInteraction = Date.now();
  timerEl.classList.remove("fade-out");
  controls.classList.remove("fade-out");
});

setInterval(()=>{
  if(hasStarted && !paused && Date.now()-lastInteraction>5000){
    timerEl.classList.add("fade-out");
    controls.classList.add("fade-out");
  }
},1000);

// INIT
loadSettings();
timerEl.innerText = formatTime(seconds);

</script>

</body>
</html>
