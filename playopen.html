<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meditation Timer Open</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --text-color:#ffffff;
  --bg-color:#232f52;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

#bgImage{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
}

#overlay{
  position:fixed;
  inset:0;
  z-index:-2;
}

#timer{
  font-size:clamp(40px,10vw,80px);
  font-weight:600;
  transition:opacity 1.8s ease;
}

#controls{
  margin-top:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  transition:opacity 1.8s ease;
}

.fade-out{opacity:0;}

button{
  padding:14px 30px;
  width:160px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* COMPLETE OVERLAY */

.complete-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  opacity:0;
  transition: opacity 1.5s ease;
  pointer-events:none;
}

.complete-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.complete-content{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:0;
  transform: scale(0.95);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.complete-overlay.show .complete-content {
  opacity: 1;
  transform: scale(1);
}

.complete-title{
  font-size:42px;
  margin-bottom:10px;
}

.complete-sub{
  font-size:16px;
  opacity:0.8;
  margin-bottom:80px;
}

#journalBtn img{
  width:75px;
  opacity:0.4;
}
</style>
</head>

<body>

<img id="bgImage" src="">
<div id="overlay"></div>

<div>
  <div id="timer">00:00</div>
  <div id="controls">
    <button id="toggleBtn">Start</button>
    <button id="editBtn">Edit Settings</button>
    <button id="finishBtn">Session finished</button>
  </div>
</div>

<div id="completeOverlay" class="complete-overlay">
  <div class="complete-content">
    <div class="complete-title">Session complete</div>
    <div class="complete-sub">Tap to return to settings</div>
    <button id="journalBtn">
      <img src="https://tppyzexttkuvcobbbmaz.supabase.co/storage/v1/object/public/Other/journal_pen_white.png" />
    </button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://tppyzexttkuvcobbbmaz.supabase.co";
const SUPABASE_KEY = "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";

// STATE
let seconds = 0;
let interval = null;
let paused = false;
let hasStarted = false;

let intervalAudio = null;

let lastInteraction = Date.now();

// ELEMENTS
const timerEl = document.getElementById("timer");
const toggleBtn = document.getElementById("toggleBtn");
const controls = document.getElementById("controls");

// LOAD SETTINGS
function loadSettings(){
  const intervalBell = localStorage.getItem("timeropen_intervalbell_url");
  const intervalDuration = localStorage.getItem("timeropen_intervalduration");
  const themeName = localStorage.getItem("timeropen_theme");

  if(intervalBell) intervalAudio = new Audio(intervalBell);

  window.intervalDurationValue = intervalDuration;

  applyTheme(themeName);
}

// APPLY THEME
async function applyTheme(name){
  if(!name){
    document.body.style.background = "#232f52";
    return;
  }

  const res = await fetch(`${SUPABASE_URL}/rest/v1/selfpracticetheme?name=eq.${name}`,{
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`
    }
  });

  const data = await res.json();
  const theme = data[0];
  if(!theme) return;

  if(theme.text_color) document.documentElement.style.setProperty("--text-color", theme.text_color);
  if(theme.imageurl) document.getElementById("bgImage").src = theme.imageurl;
  if(theme.bg_overlay_color) document.getElementById("overlay").style.background = theme.bg_overlay_color;
}

// FORMAT TIME
function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

// START TIMER
function startTimer(){
  hasStarted = true;

  interval = setInterval(()=>{
    if(!paused){
      seconds++;
      timerEl.innerText = formatTime(seconds);

      // INTERVAL BELL
      const intervalMin = parseInt(window.intervalDurationValue);

      if(intervalMin && intervalMin > 0 && intervalAudio){
        if(seconds % (intervalMin * 60) === 0){
          intervalAudio.currentTime = 0;
          intervalAudio.play().catch(()=>{});
        }
      }
    }
  },1000);
}

// BUTTONS
toggleBtn.onclick = () => {
  lastInteraction = Date.now();

  if(!interval){
    toggleBtn.innerText = "Pause";
    startTimer();
  } else {
    paused = !paused;
    toggleBtn.innerText = paused ? "Resume" : "Pause";
  }
};

document.getElementById("editBtn").onclick = () => {
  window.location.href = "https://etl-1234.github.io/Timer/setupopen.html";
};

// FINISH BUTTON
document.getElementById("finishBtn").onclick = () => {
  showOverlay();
};

// SHOW OVERLAY
function showOverlay(){
  clearInterval(interval);

  timerEl.classList.add("fade-out");
  controls.classList.add("fade-out");

  setTimeout(()=>{
    document.getElementById("completeOverlay").classList.add("show");
  },1000);
}

// OVERLAY CLICK
document.getElementById("completeOverlay").onclick = () => {
  window.location.href = "https://etl-1234.github.io/Timer/setupopen.html";
};

// JOURNAL
document.getElementById("journalBtn").onclick = (e)=>{
  e.stopPropagation();
  window.location.href = "https://etl-1234.github.io/Journal/journalpage.html";
};

// AUTO FADE UI
document.body.addEventListener("click", ()=>{
  lastInteraction = Date.now();
  timerEl.classList.remove("fade-out");
  controls.classList.remove("fade-out");
});

setInterval(()=>{
  if(hasStarted && !paused && Date.now()-lastInteraction>5000){
    timerEl.classList.add("fade-out");
    controls.classList.add("fade-out");
  }
},1000);

// INIT
loadSettings();
timerEl.innerText = formatTime(seconds);

</script>

</body>
</html>
