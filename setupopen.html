<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meditation Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg-color:#232f52;
  --text-color:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  gap:18px;
  padding:20px;
}

#pageTitle {
  font-size: 32px;
  text-align: center;
  margin-bottom: 160px;
}

#pageSubtitle {
  font-size: 20px;
  font-style: italic;
  color: rgba(255,255,255,0.6);
  text-align: center;
  margin-top: -160px;
  margin-bottom: 40px;
}

/* BUTTONS */

.option-btn {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  width: 100%;
  max-width: 420px;
  padding: 18px;
  border-radius: 18px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 18px;
  cursor: pointer;
  gap: 20px;
}

.option-btn .label {
  flex: 0 0 140px;
  color: white;
  opacity: 1;
  text-align: left;
}

.option-btn .value {
  flex: 1 1 auto;
  color: rgba(255,255,255,0.6);
  font-style: italic;
  text-align: left;
}

/* START BUTTON */

#startBtn{
  margin-top:20px;
  width:90px;
  height:90px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.15);
  color:white;
  font-size:18px;
  cursor:not-allowed;
  opacity:.4;
  display:flex;
  align-items:center;
  justify-content:center;
}

#startBtn.active{
  cursor:pointer;
  opacity:1;
}
</style>
</head>

<body>

<h1 id="pageTitle">Practice Settings</h1>
<p id="pageSubtitle">Open-ended practices</p>
  
<button class="option-btn" id="intervalBellBtn">
  <span class="label">Interval bell</span>
  <span class="value" id="intervalBellText">none</span>
</button>

<button class="option-btn" id="intervalDurationBtn">
  <span class="label">Interval duration</span>
  <span class="value" id="intervalDurationText">none</span>
</button>

<button class="option-btn" id="themeBtn">
  <span class="label">Theme</span>
  <span class="value" id="themeText">none</span>
</button>

<button id="startBtn">Start</button>

<script>

// LOAD SAVED SETTINGS
const intervalBell = localStorage.getItem("timeropen_intervalbell");
const intervalDuration = localStorage.getItem("timeropen_intervalduration");
const theme = localStorage.getItem("timeropen_theme");

// ELEMENTS
const intervalBellText = document.getElementById("intervalBellText");
const intervalDurationText = document.getElementById("intervalDurationText");
const themeText = document.getElementById("themeText");
const startBtn = document.getElementById("startBtn");

// APPLY VALUES
if(intervalBell) intervalBellText.innerText = intervalBell;
if(intervalDuration) intervalDurationText.innerText = intervalDuration;
if(theme) themeText.innerText = theme;

// ENABLE START BUTTON
function checkReady(){
  if(intervalBell && intervalDuration){
    startBtn.classList.add("active");
    startBtn.style.cursor = "pointer";
  }
}

checkReady();

// NAVIGATION
document.getElementById("intervalBellBtn").onclick = () => {
  window.location.href = "https://etl-1234.github.io/Timer/bell.html";
};

document.getElementById("intervalDurationBtn").onclick = () => {
  window.location.href = "https://etl-1234.github.io/Timer/interval.html";
};

document.getElementById("themeBtn").onclick = () => {
  window.location.href = "https://etl-1234.github.io/Timer/grid.html";
};

// START
startBtn.onclick = () => {
  if(!startBtn.classList.contains("active")) return;
  window.location.href = "https://etl-1234.github.io/Timer/play.html";
};

</script>

</body>
</html>
